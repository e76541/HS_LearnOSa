<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnOS TERMINAL</title>
<style>
:root{
  --bg:#0a0e14; --panel:#10151f; --panel-edge:#1c2533; --grid-line:#161d29;
  --txt:#c8d3e0; --txt-dim:#5a6b80; --txt-faint:#38455a;
  --up:#ff4d5e; --down:#2ecc8f; --amber:#e8b64c;
  --ice:#4db8ff; --ice-deep:#1a6fae; --alert:#ff4d5e; --violet:#9d7bff;
  --mono:"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px}
body{min-height:100vh;background:
  linear-gradient(160deg, rgba(77,184,255,.04) 0%, transparent 40%), var(--bg)}

header{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--panel-edge);
  background:linear-gradient(90deg,#0d1420,#0a0e14);
  position:sticky;top:0;z-index:10;
}
.logo{font-weight:700;letter-spacing:.14em;color:var(--ice);font-size:14px;cursor:pointer}
.logo span{color:var(--txt-dim);font-weight:400}
.clock{color:var(--txt-dim);font-size:12px;margin-left:auto}
.mkt{font-size:11px;padding:2px 8px;border:1px solid var(--ice-deep);color:var(--ice);border-radius:2px;letter-spacing:.1em}

.switchbar{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:6px 14px;border-bottom:1px solid var(--grid-line);background:#0c111a;
}
.sw{
  font-size:11px;letter-spacing:.06em;cursor:pointer;user-select:none;
  padding:3px 10px;border:1px solid var(--panel-edge);border-radius:2px;
  color:var(--txt-faint);transition:all .15s;font-family:var(--mono);background:none;
}
.sw.on{color:var(--ice);border-color:var(--ice-deep);background:rgba(77,184,255,.07)}
.sw:focus-visible{outline:1px solid var(--ice)}

main{display:grid;gap:10px;padding:10px 14px 40px;grid-template-columns:repeat(12,1fr)}
.panel{border:1px solid var(--panel-edge);background:var(--panel);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.panel.hidden{display:none}
.p-head{
  display:flex;align-items:baseline;gap:8px;
  padding:7px 10px;border-bottom:1px solid var(--grid-line);
  font-size:11px;letter-spacing:.12em;color:var(--txt-dim);
}
.p-head b{color:var(--txt);font-weight:600}
.p-head .tag{margin-left:auto;font-size:10px;color:var(--txt-faint)}
.p-body{flex:1;overflow:auto}
#p-ticker{grid-column:span 12}
#p-queue{grid-column:span 7}
#p-alert{grid-column:span 5}
@media(max-width:760px){ #p-queue,#p-alert{grid-column:span 12} }

/* ── 報價牆:文本行情 ── */
.t-row{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:9px 12px;border-bottom:1px solid var(--grid-line);cursor:pointer;
}
.t-row:hover{background:rgba(77,184,255,.06)}
.t-zh{font-size:13px;color:var(--txt);min-width:9em}
.t-id{font-size:11px;color:var(--ice)}
.t-m{font-size:15px;font-weight:700;margin-left:auto}
.t-d{font-size:12px;min-width:5.5em;text-align:right}
.t-last{font-size:11px;color:var(--txt-faint);min-width:4.5em;text-align:right}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--txt-dim)}
.badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;letter-spacing:.08em;margin-left:6px;vertical-align:1px}
.b-dormant{border:1px solid var(--amber);color:var(--amber)}
.b-trial{border:1px solid var(--txt-faint);color:var(--txt-dim)}

/* ── 佇列 / 警示 ── */
.q-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--grid-line)}
.q-row:hover{background:rgba(77,184,255,.05)}
.q-eta{width:64px;font-size:11px;color:var(--txt-dim);text-align:right}
.q-eta.due{color:var(--alert);font-weight:600}
.q-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.q-name small{display:block;color:var(--txt-faint);font-size:10px}
.q-type{font-size:10px;color:var(--txt-faint);letter-spacing:.08em}
.q-go{font-size:11px;padding:3px 10px;border:1px solid var(--ice-deep);background:transparent;color:var(--ice);border-radius:2px;cursor:pointer;font-family:var(--mono)}
.q-go:hover{background:rgba(77,184,255,.12)}
.a-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--grid-line);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.red{background:var(--alert);animation:blink 1s steps(2,start) infinite}
.dot.amber{background:var(--amber)}
@keyframes blink{50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.dot.red{animation:none}}
.a-msg small{display:block;color:var(--txt-faint);font-size:10px;margin-top:2px}

/* ── 子視圖共用 ── */
.subview{display:none;padding:10px 14px 40px}
.subview.show{display:block}
.map-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.back{font-size:12px;padding:4px 12px;border:1px solid var(--panel-edge);color:var(--txt-dim);background:none;border-radius:2px;cursor:pointer;font-family:var(--mono)}
.back:hover{color:var(--ice);border-color:var(--ice-deep)}
.map-title{font-size:14px}
.map-title small{color:var(--ice);font-size:11px;margin-left:8px}
.crumb{font-size:10px;color:var(--txt-faint);letter-spacing:.08em;width:100%}
.crumb b{color:var(--txt-dim);font-weight:400}

/* ── 路線圖 ── */
#routeWrap{border:1px solid var(--panel-edge);background:var(--panel);border-radius:3px;overflow:hidden}
#routeSvg{width:100%;display:block;touch-action:manipulation}
.edge-line{stroke-width:1.5;fill:none;opacity:.75}
.edge-label{font-size:9px;fill:var(--txt-faint);font-family:var(--mono);letter-spacing:.05em}
.node rect{fill:#141b28;stroke:var(--panel-edge);rx:3;cursor:pointer;transition:stroke .12s}
.node:hover rect{stroke:var(--ice)}
.node text{font-family:var(--mono);pointer-events:none}
.n-zh{font-size:11px;fill:var(--txt)}
.n-id{font-size:8px;fill:var(--txt-faint)}
.n-m{font-size:11px;font-weight:700}
.node.anchor rect{stroke:var(--ice-deep);fill:#12233355}
.node.anchor .n-zh{fill:var(--ice)}
.legend{display:flex;gap:14px;padding:7px 10px;font-size:10px;color:var(--txt-dim);border-top:1px solid var(--grid-line);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle}
.route-hint{text-align:center;font-size:11px;color:var(--txt-faint);margin-top:10px}
.route-actions{display:flex;justify-content:center;margin-top:12px}
.act{
  font-size:12px;padding:6px 18px;border-radius:2px;cursor:pointer;font-family:var(--mono);
  border:1px solid var(--ice-deep);background:rgba(77,184,255,.1);color:var(--ice);
}
.act:hover{background:rgba(77,184,255,.18)}
.act.ghost{border-color:var(--panel-edge);background:none;color:var(--txt-dim)}
.act:disabled{opacity:.35;cursor:not-allowed}

/* ── 九宮 ── */
.sel-count{margin-left:auto;font-size:11px;color:var(--txt-dim)}
.sel-count b{color:var(--ice)}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:0 auto}
.cell{
  aspect-ratio:1;border:1px solid var(--panel-edge);border-radius:3px;
  background:var(--panel);cursor:pointer;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
  padding:8px;text-align:center;transition:border-color .12s, background .12s;
  font-family:var(--mono);color:var(--txt);
}
.cell:hover{border-color:var(--ice-deep)}
.cell.center{background:linear-gradient(160deg, rgba(77,184,255,.12), var(--panel));border-color:var(--ice-deep);cursor:default}
.cell.selected{border-color:var(--ice);background:rgba(77,184,255,.13);box-shadow:inset 0 0 0 1px var(--ice)}
.cell.selected::after{content:"✓";position:absolute;top:5px;right:8px;color:var(--ice);font-size:12px}
.c-zh{font-size:12px;line-height:1.35}
.c-id{font-size:9px;color:var(--txt-faint);word-break:break-all;line-height:1.3}
.c-m{font-size:13px;font-weight:700}
.cell.center .c-zh{font-size:13px;color:var(--ice)}
.cell.center .c-m{font-size:16px}
.map-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.map-hint{text-align:center;font-size:11px;color:var(--txt-faint);margin-top:10px}

footer{
  position:fixed;bottom:0;left:0;right:0;background:#0c111a;
  border-top:1px solid var(--panel-edge);padding:5px 14px;font-size:10px;
  color:var(--txt-faint);display:flex;gap:18px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;
}
footer b{color:var(--txt-dim);font-weight:400}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goDash()">LEARNOS<span> / TERMINAL</span></div>
  <div class="mkt">PRACTICE OPEN</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="switchbar" id="switchbar" role="group" aria-label="面板開關"></div>

<main id="view-dash">
  <section class="panel" id="p-ticker">
    <div class="p-head"><b>報價牆</b> MODULE BOARD <span class="tag">點擊 → 路線圖 → 九宮</span></div>
    <div class="p-body" id="tickerBody"></div>
  </section>
  <section class="panel" id="p-queue">
    <div class="p-head"><b>待練習佇列</b> ORDER QUEUE <span class="tag">SRS 到期排序</span></div>
    <div class="p-body" id="queueBody"></div>
  </section>
  <section class="panel" id="p-alert">
    <div class="p-head"><b>警示</b> ALERTS</div>
    <div class="p-body" id="alertBody"></div>
  </section>
</main>

<!-- 路線圖視圖 -->
<div class="subview" id="view-route">
  <div class="map-bar">
    <button class="back" onclick="goDash()">← 行情</button>
    <div class="map-title" id="routeTitle"></div>
    <div class="crumb">行情 <b>→ 路線圖</b> → 九宮</div>
  </div>
  <div id="routeWrap">
    <svg id="routeSvg" viewBox="0 0 640 460" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="routeLegend"></div>
  </div>
  <div class="route-actions">
    <button class="act" onclick="openGridForAnchor()">進入本模組九宮 →</button>
  </div>
  <div class="route-hint">點擊相鄰模組節點:切換錨點重繪路線;虛線為 background(舞台非演員)</div>
</div>

<!-- 九宮視圖 -->
<div class="subview" id="view-grid">
  <div class="map-bar">
    <button class="back" onclick="backToRoute()">← 路線圖</button>
    <div class="map-title" id="gridTitle"></div>
    <div class="sel-count" id="selCount"></div>
    <div class="crumb">行情 → 路線圖 <b>→ 九宮</b></div>
  </div>
  <div class="grid9" id="grid9"></div>
  <div class="map-actions">
    <button class="act" id="btnPractice" disabled onclick="startPractice()">開始練習選取區域</button>
    <button class="act ghost" onclick="selectAll()">全選</button>
    <button class="act ghost" onclick="clearSel()">清除</button>
  </div>
  <div class="map-hint">點擊外圈格子選取練習區域,中宮為模組本體</div>
</div>

<footer>
  <b>MODULES</b> <span id="f-mod">--</span>
  <b>DUE</b> <span id="f-due">--</span>
  <b>DORMANT</b> <span id="f-dorm">--</span>
  <b>STREAK</b> <span>6d</span>
</footer>

<script>
/* ── 模組 ── */
const MODULES=[
 {id:"srs_scheduling",zh:"間隔重複排程",skill:"memory_ops",mastery:82,d7:+4.2,state:"active",last:"昨天"},
 {id:"bazi_veto_gate",zh:"八字否決閘",skill:"decision_sys",mastery:74,d7:+1.8,state:"active",last:"2天前"},
 {id:"dsr_deflation",zh:"DSR 縮減夏普",skill:"quant_stats",mastery:66,d7:-2.1,state:"active",last:"5天前"},
 {id:"nine_grid_traversal",zh:"九宮隨機走訪",skill:"practice_proto",mastery:91,d7:+0.6,state:"active",last:"今天"},
 {id:"pbo_overfit",zh:"PBO 過擬合機率",skill:"quant_stats",mastery:58,d7:-4.5,state:"dormant",last:"18天前"},
 {id:"skos_broader_than",zh:"SKOS 上位邊",skill:"knowledge_arch",mastery:70,d7:0,state:"active",last:"3天前"},
 {id:"triage_verbs",zh:"六處置動詞",skill:"knowledge_arch",mastery:45,d7:+6.3,state:"trial",last:"今天"},
 {id:"ag_price_pipeline",zh:"農產價格管線",skill:"data_eng",mastery:63,d7:+3.0,state:"active",last:"昨天"},
 {id:"multiple_testing",zh:"多重檢定校正",skill:"quant_stats",mastery:52,d7:-1.0,state:"active",last:"7天前"},
 {id:"fishpool_arch",zh:"魚池架構",skill:"quant_ops",mastery:77,d7:+2.2,state:"active",last:"昨天"},
];
const MOD=Object.fromEntries(MODULES.map(m=>[m.id,m]));

/* ── 邊(LearnOS edges):type ∈ prereq / broader_than / background / related ── */
const EDGES=[
 {from:"dsr_deflation",to:"pbo_overfit",type:"related"},
 {from:"multiple_testing",to:"dsr_deflation",type:"prereq"},
 {from:"multiple_testing",to:"pbo_overfit",type:"prereq"},
 {from:"pbo_overfit",to:"fishpool_arch",type:"related"},
 {from:"dsr_deflation",to:"fishpool_arch",type:"related"},
 {from:"skos_broader_than",to:"triage_verbs",type:"broader_than"},
 {from:"srs_scheduling",to:"nine_grid_traversal",type:"prereq"},
 {from:"nine_grid_traversal",to:"triage_verbs",type:"background"},
 {from:"bazi_veto_gate",to:"fishpool_arch",type:"background"},
 {from:"srs_scheduling",to:"bazi_veto_gate",type:"background"},
 {from:"ag_price_pipeline",to:"fishpool_arch",type:"related"},
 {from:"skos_broader_than",to:"nine_grid_traversal",type:"background"},
];
const EDGE_STYLE={
 prereq:{color:"#4db8ff",dash:"",label:"prereq 先修"},
 broader_than:{color:"#e8b64c",dash:"",label:"broader_than 上位"},
 related:{color:"#9d7bff",dash:"",label:"related 相關"},
 background:{color:"#5a6b80",dash:"5,4",label:"background 背景"},
};

/* ── 各模組九宮 ── */
const GRIDS={
 bazi_veto_gate:[
  {id:"ten_gods",zh:"十神結構",m:78},{id:"useful_god",zh:"用神取法",m:65},
  {id:"luck_pillars",zh:"大運排法",m:82},{id:"veto_rules",zh:"否決規則集",m:71},
  {id:"gate_ordering",zh:"閘門順序",m:60},{id:"signal_mapping",zh:"訊號對映",m:55},
  {id:"conflict_res",zh:"衝突裁決",m:48},{id:"case_log",zh:"案例回測",m:69},
 ],
 pbo_overfit:[
  {id:"cscv_split",zh:"CSCV 切分",m:62},{id:"logit_lambda",zh:"λ 邏輯值",m:50},
  {id:"rank_matrix",zh:"排名矩陣",m:57},{id:"oos_degradation",zh:"樣本外衰退",m:66},
  {id:"pbo_threshold",zh:"門檻判準",m:44},{id:"fishpool_link",zh:"魚池整合",m:59},
  {id:"dsr_relation",zh:"與DSR關係",m:63},{id:"report_format",zh:"報告格式",m:52},
 ],
 dsr_deflation:[
  {id:"sharpe_base",zh:"夏普原式",m:80},{id:"trials_n",zh:"試驗次數N",m:64},
  {id:"skew_kurt",zh:"偏度峰度修正",m:55},{id:"expected_max",zh:"期望最大值",m:58},
  {id:"var_sr",zh:"SR 變異數",m:61},{id:"threshold_use",zh:"門檻應用",m:70},
  {id:"g_gate_link",zh:"G閘整合",m:73},{id:"pitfalls",zh:"常見誤用",m:60},
 ],
};
function fallbackGrid(mod){
  const names=["定義","公式","案例","邊界","反例","連結","口述","應用"];
  return names.map((n,i)=>({id:mod.id+"_z"+(i+1),zh:mod.zh.slice(0,2)+"·"+n,m:Math.max(5,Math.min(99,Math.round(mod.mastery+(i*7%21)-10)))}));
}

const QUEUE=[
 {eta:"逾期 2d",due:true,id:"pbo_overfit",zh:"PBO 過擬合機率",type:"口述"},
 {eta:"逾期 6h",due:true,id:"dsr_deflation",zh:"DSR 縮減夏普",type:"公式"},
 {eta:"今天",due:false,id:"bazi_veto_gate",zh:"八字否決閘",type:"九宮"},
 {eta:"明天",due:false,id:"skos_broader_than",zh:"SKOS 上位邊",type:"口述"},
 {eta:"3天後",due:false,id:"ag_price_pipeline",zh:"農產價格管線",type:"九宮"},
];
const ALERTS=[
 {lv:"red",msg:"pbo_overfit 已休眠 18 天",sub:"熟練度跌破 60,建議進入九宮回補"},
 {lv:"red",msg:"2 筆練習逾期",sub:"佇列頂部,合計預估 12 分鐘"},
 {lv:"amber",msg:"triage_verbs 處於 trial 狀態",sub:"連續 3 次練習達標可轉 active"},
 {lv:"amber",msg:"quant_stats 技能組 Δ7d 為負",sub:"-3.3,兩個成員模組同步下滑"},
];

/* ── 面板開關 ── */
const PANELS=[{key:"p-ticker",label:"報價牆"},{key:"p-queue",label:"佇列"},{key:"p-alert",label:"警示"}];
const layoutState={"p-ticker":true,"p-queue":true,"p-alert":true};
const bar=document.getElementById("switchbar");
PANELS.forEach(p=>{
  const b=document.createElement("button");
  b.className="sw"+(layoutState[p.key]?" on":"");
  b.textContent=(layoutState[p.key]?"● ":"○ ")+p.label;
  b.onclick=()=>{
    layoutState[p.key]=!layoutState[p.key];
    b.classList.toggle("on",layoutState[p.key]);
    b.textContent=(layoutState[p.key]?"● ":"○ ")+p.label;
    document.getElementById(p.key).classList.toggle("hidden",!layoutState[p.key]);
  };
  bar.appendChild(b);
});

/* ── 報價牆 ── */
const tb=document.getElementById("tickerBody");
MODULES.forEach(m=>{
  const cls=m.d7>0?"up":m.d7<0?"down":"flat";
  const sign=m.d7>0?"▲":m.d7<0?"▼":"–";
  const badge=m.state==="dormant"?'<span class="badge b-dormant">DORMANT</span>'
             :m.state==="trial"?'<span class="badge b-trial">TRIAL</span>':"";
  const d=document.createElement("div");
  d.className="t-row";
  d.innerHTML=`
    <span class="t-zh">${m.zh}${badge}</span>
    <span class="t-id">${m.id}</span>
    <span class="t-m ${cls}">${m.mastery}</span>
    <span class="t-d ${cls}">${sign} ${Math.abs(m.d7).toFixed(1)}</span>
    <span class="t-last">${m.last}</span>`;
  d.onclick=()=>openRoute(m);
  tb.appendChild(d);
});

/* ── 佇列 / 警示 ── */
const qb=document.getElementById("queueBody");
QUEUE.forEach(q=>{
  const d=document.createElement("div");
  d.className="q-row";
  d.innerHTML=`
    <div class="q-eta ${q.due?"due":""}">${q.eta}</div>
    <div class="q-name">${q.zh}<small>${q.id}</small></div>
    <div class="q-type">${q.type}</div>
    <button class="q-go">練習</button>`;
  d.querySelector(".q-go").onclick=e=>{e.stopPropagation();openRoute(MOD[q.id]);};
  qb.appendChild(d);
});
const ab=document.getElementById("alertBody");
ALERTS.forEach(a=>{
  const d=document.createElement("div");
  d.className="a-row";
  d.innerHTML=`<span class="dot ${a.lv==="red"?"red":"amber"}"></span>
    <div class="a-msg">${a.msg}<small>${a.sub}</small></div>`;
  ab.appendChild(d);
});

/* ── 視圖切換 ── */
let currentModule=null, selection=new Set();
function show(id){
  document.getElementById("view-dash").style.display=id==="dash"?"grid":"none";
  document.getElementById("view-route").classList.toggle("show",id==="route");
  document.getElementById("view-grid").classList.toggle("show",id==="grid");
  window.scrollTo(0,0);
}
function goDash(){show("dash")}
function backToRoute(){show("route")}

/* ── 路線圖(錨點 + 一階鄰居,漸進揭露) ── */
function openRoute(mod){
  currentModule=mod;
  document.getElementById("routeTitle").innerHTML=
    `${mod.zh}<small>${mod.id} · 熟練 ${mod.mastery}</small>`;
  drawRoute(mod);
  show("route");
}
function neighborsOf(id){
  const out=[];
  EDGES.forEach(e=>{
    if(e.from===id)out.push({id:e.to,type:e.type,dir:"out"});
    else if(e.to===id)out.push({id:e.from,type:e.type,dir:"in"});
  });
  return out;
}
function drawRoute(anchor){
  const svg=document.getElementById("routeSvg");
  svg.innerHTML="";
  const W=640,H=460,cx=W/2,cy=H/2;
  const nbs=neighborsOf(anchor.id);
  const R=Math.min(W,H)/2-70;
  const NS="http://www.w3.org/2000/svg";
  const nodeW=118,nodeH=52;

  /* 先畫邊 */
  nbs.forEach((nb,i)=>{
    const ang=-Math.PI/2 + i*(2*Math.PI/Math.max(nbs.length,1));
    nb.x=cx+R*Math.cos(ang); nb.y=cy+R*Math.sin(ang);
    const st=EDGE_STYLE[nb.type];
    const line=document.createElementNS(NS,"line");
    line.setAttribute("x1",cx);line.setAttribute("y1",cy);
    line.setAttribute("x2",nb.x);line.setAttribute("y2",nb.y);
    line.setAttribute("class","edge-line");
    line.setAttribute("stroke",st.color);
    if(st.dash)line.setAttribute("stroke-dasharray",st.dash);
    svg.appendChild(line);
    /* 邊標籤 + 方向 */
    const lx=cx+(nb.x-cx)*.55, ly=cy+(nb.y-cy)*.55;
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",lx);t.setAttribute("y",ly-4);
    t.setAttribute("class","edge-label");t.setAttribute("text-anchor","middle");
    t.textContent=(nb.dir==="in"?"◂ ":"▸ ")+nb.type;
    svg.appendChild(t);
  });

  /* 節點 */
  function makeNode(m,x,y,isAnchor){
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","node"+(isAnchor?" anchor":""));
    const r=document.createElementNS(NS,"rect");
    r.setAttribute("x",x-nodeW/2);r.setAttribute("y",y-nodeH/2);
    r.setAttribute("width",nodeW);r.setAttribute("height",nodeH);
    g.appendChild(r);
    const cls=m.mastery>=70?"var(--up)":m.mastery<55?"var(--down)":"var(--txt-dim)";
    const t1=document.createElementNS(NS,"text");
    t1.setAttribute("x",x);t1.setAttribute("y",y-8);t1.setAttribute("text-anchor","middle");
    t1.setAttribute("class","n-zh");t1.textContent=m.zh;
    const t2=document.createElementNS(NS,"text");
    t2.setAttribute("x",x);t2.setAttribute("y",y+6);t2.setAttribute("text-anchor","middle");
    t2.setAttribute("class","n-id");t2.textContent=m.id;
    const t3=document.createElementNS(NS,"text");
    t3.setAttribute("x",x);t3.setAttribute("y",y+20);t3.setAttribute("text-anchor","middle");
    t3.setAttribute("class","n-m");t3.setAttribute("fill",cls);t3.textContent=m.mastery;
    g.append(t1,t2,t3);
    if(isAnchor){ r.style.cursor="pointer"; g.onclick=()=>openGrid(m); }
    else g.onclick=()=>openRoute(m);
    svg.appendChild(g);
  }
  nbs.forEach(nb=>makeNode(MOD[nb.id],nb.x,nb.y,false));
  makeNode(anchor,cx,cy,true);

  /* 圖例 */
  const lg=document.getElementById("routeLegend");
  lg.innerHTML="";
  Object.values(EDGE_STYLE).forEach(s=>{
    lg.innerHTML+=`<span><i style="background:${s.color};${s.dash?"background:repeating-linear-gradient(90deg,"+s.color+" 0 5px,transparent 5px 9px)":""}"></i>${s.label}</span>`;
  });
}
function openGridForAnchor(){openGrid(currentModule)}

/* ── 九宮 ── */
function openGrid(mod){
  currentModule=mod; selection.clear();
  document.getElementById("gridTitle").innerHTML=
    `${mod.zh}<small>${mod.id} · 熟練 ${mod.mastery}</small>`;
  renderGrid(); show("grid");
}
function renderGrid(){
  const zones=GRIDS[currentModule.id]||fallbackGrid(currentModule);
  currentModule._zones=zones;
  const g=document.getElementById("grid9");
  g.innerHTML="";
  const order=[0,1,2,3,"C",4,5,6,7];
  order.forEach(o=>{
    const c=document.createElement("div");
    if(o==="C"){
      c.className="cell center";
      c.innerHTML=`<div class="c-zh">${currentModule.zh}</div>
        <div class="c-id">${currentModule.id}</div>
        <div class="c-m">${currentModule.mastery}</div>`;
    }else{
      const z=zones[o];
      const cls=z.m>=70?"up":z.m<55?"down":"flat";
      c.className="cell";
      c.setAttribute("role","checkbox");c.setAttribute("tabindex","0");
      c.innerHTML=`<div class="c-zh">${z.zh}</div>
        <div class="c-id">${z.id}</div>
        <div class="c-m ${cls}">${z.m}</div>`;
      const toggle=()=>{
        if(selection.has(z.id)){selection.delete(z.id);c.classList.remove("selected")}
        else{selection.add(z.id);c.classList.add("selected")}
        updateSel();
      };
      c.onclick=toggle;
      c.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle();}};
    }
    g.appendChild(c);
  });
  updateSel();
}
function updateSel(){
  document.getElementById("selCount").innerHTML=
    selection.size?`已選 <b>${selection.size}</b> / 8 區域`:"未選取區域";
  document.getElementById("btnPractice").disabled=selection.size===0;
}
function selectAll(){
  currentModule._zones.forEach(z=>selection.add(z.id));
  document.querySelectorAll("#grid9 .cell:not(.center)").forEach(c=>c.classList.add("selected"));
  updateSel();
}
function clearSel(){
  selection.clear();
  document.querySelectorAll("#grid9 .cell.selected").forEach(c=>c.classList.remove("selected"));
  updateSel();
}
function startPractice(){
  alert("練習 session(佔位)\n模組:"+currentModule.id+"\n區域:\n"+[...selection].join("\n"));
}
