<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-labelledby="title desc">
  <title id="title">AI 模型路由試作概念圖</title>
  <desc id="desc">以十八個試作候選模塊呈現模型剖面、任務路由、成本、合規、供應商韌性與定期重評。所有模型事實均未外部核對。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163f73"/>
      <stop offset="1" stop-color="#244f8d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7da9df"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f6c453"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; fill: #f7fbff; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; fill: #9fb2ca; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; fill: #8eb8e8; letter-spacing: 1.8px; }
      .node-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; fill: #f8fbff; }
      .node-body { font: 500 14px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; fill: #c7d5e5; }
      .node-meta { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8fa8c3; }
      .chip { font: 700 11px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; fill: #07111f; }
      .edge { fill: none; stroke: #6f95c4; stroke-width: 2.2; opacity: 0.75; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #6282a8; stroke-width: 1.7; stroke-dasharray: 7 7; opacity: 0.55; marker-end: url(#arrow); }
      .edge-gold { fill: none; stroke: #f6c453; stroke-width: 2.4; opacity: 0.9; marker-end: url(#arrowGold); }
      .edge-label { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #96b7db; }
      .card { fill: #101f36; stroke: #466585; stroke-width: 1.6; }
      .unverified { stroke-dasharray: 8 6; }
      .provided { stroke: #55c59a; stroke-width: 2.2; }
      .missing { stroke: #e6a15a; stroke-width: 2; stroke-dasharray: 3 5; }
    </style>
  </defs>

  <rect width="1800" height="1350" fill="url(#bg)"/>
  <circle cx="1500" cy="90" r="250" fill="#163a68" opacity="0.16"/>
  <circle cx="200" cy="1200" r="310" fill="#4b2768" opacity="0.12"/>

  <text x="70" y="58" class="title">AI 模型路由｜試作 Dynamic View</text>
  <text x="70" y="88" class="subtitle">任務特徵 → 路由判斷 → 模型選擇 → 成本／合規／韌性覆核</text>
  <g transform="translate(1320 42)">
    <rect width="410" height="58" rx="16" fill="#0d1b2e" stroke="#e6a15a" stroke-dasharray="7 6"/>
    <circle cx="24" cy="21" r="6" fill="#e6a15a"/>
    <text x="40" y="26" class="node-body">虛線框＝support_status: unverified</text>
    <text x="20" y="47" class="node-meta">試作 ID 非正式 module_id｜完整 25 邊見報告</text>
  </g>

  <text x="70" y="145" class="section">核心主張</text>
  <g filter="url(#shadow)">
    <rect x="530" y="125" width="740" height="112" rx="24" fill="url(#core)" stroke="#70a4dc" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="565" y="160" class="node-meta">AMR-C00 · [83,949) · interpretation · unverified</text>
    <text x="565" y="194" class="node-title">沒有單一最佳模型</text>
    <text x="565" y="220" class="node-body">固定單模型會在價格、品質或任務適配上付出代價。</text>
  </g>

  <text x="70" y="290" class="section">模型剖面｜文章中的可查核敘述尚未核對</text>
  <path d="M300 320 C300 260, 650 255, 680 237" class="edge-soft"/>
  <path d="M900 320 L900 237" class="edge-soft"/>
  <path d="M1500 320 C1500 260, 1150 255, 1120 237" class="edge-soft"/>
  <text x="430" y="265" class="edge-label">elaborates</text>
  <text x="910" y="272" class="edge-label">elaborates</text>
  <text x="1270" y="265" class="edge-label">elaborates</text>

  <g filter="url(#shadow)">
    <rect x="80" y="305" width="440" height="118" rx="20" class="card unverified" stroke="#35c7d4"/>
    <rect x="100" y="325" width="72" height="22" rx="11" fill="#35c7d4"/>
    <text x="114" y="341" class="chip">KIMI K3</text>
    <text x="188" y="342" class="node-meta">AMR-C01 · [988,1475)</text>
    <text x="104" y="376" class="node-title">前端、多模態、成本位置</text>
    <text x="104" y="402" class="node-body">發布、價格、上下文與 benchmark 均待查核。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="680" y="305" width="440" height="118" rx="20" class="card unverified" stroke="#a879e8"/>
    <rect x="700" y="325" width="118" height="22" rx="11" fill="#a879e8"/>
    <text x="712" y="341" class="chip">CLAUDE FABLE 5</text>
    <text x="836" y="342" class="node-meta">AMR-C02 · [1475,1941)</text>
    <text x="704" y="376" class="node-title">高難編碼、長時代理、溢價</text>
    <text x="704" y="402" class="node-body">能力、價格與無人值守定位均待查核。</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1280" y="305" width="440" height="118" rx="20" class="card unverified" stroke="#69cf94"/>
    <rect x="1300" y="325" width="104" height="22" rx="11" fill="#69cf94"/>
    <text x="1313" y="341" class="chip">GPT-5.6 SOL</text>
    <text x="1420" y="342" class="node-meta">AMR-C03 · [1941,2398)</text>
    <text x="1304" y="376" class="node-title">除錯能力與模糊目標風險</text>
    <text x="1304" y="402" class="node-body">層級、benchmark 與系統卡歸因均待查核。</text>
  </g>

  <text x="70" y="485" class="section">路由脊柱</text>
  <path d="M560 520 C520 455, 545 300, 680 237" class="edge"/>
  <text x="548" y="286" class="edge-label">elaborates</text>
  <g filter="url(#shadow)">
    <rect x="530" y="470" width="740" height="112" rx="24" fill="#123a35" class="provided"/>
    <text x="565" y="505" class="node-meta">AMR-C11 · [11646,13232) · advice · provided</text>
    <text x="565" y="540" class="node-title">核心技能：路由，而不是選永久最愛</text>
    <text x="565" y="565" class="node-body">避免昂貴模型做例行工作，也避免便宜模型承擔高後果難題。</text>
  </g>
  <path d="M900 655 L900 582" class="edge"/>
  <text x="912" y="622" class="edge-label">elaborates</text>
  <g filter="url(#shadow)">
    <rect x="530" y="640" width="740" height="112" rx="24" fill="#174437" class="provided"/>
    <text x="565" y="675" class="node-meta">AMR-C12 · [13232,14732) · advice · provided</text>
    <text x="565" y="710" class="node-title">Checklist：先問任務，再選模型</text>
    <text x="565" y="735" class="node-body">前端｜長時無人值守｜工作量與風險｜除錯可驗證性｜後端難度｜成本</text>
  </g>

  <text x="40" y="820" class="section">任務路由｜虛線框內推薦仍依賴未核對資料</text>
  <path d="M900 752 C900 785, 140 770, 140 842" class="edge-soft"/>
  <path d="M900 752 C900 790, 390 785, 390 842" class="edge-soft"/>
  <path d="M900 752 C900 795, 640 790, 640 842" class="edge-soft"/>
  <path d="M900 752 C900 800, 890 800, 890 842" class="edge-soft"/>
  <path d="M900 752 C900 795, 1140 790, 1140 842" class="edge-soft"/>
  <text x="735" y="790" class="edge-label">depends_on（checklist 五分支）</text>

  <g>
    <rect x="25" y="842" width="230" height="142" rx="18" class="card unverified" stroke="#35c7d4"/>
    <text x="45" y="870" class="node-meta">AMR-C04 · [2602,3904)</text>
    <text x="45" y="903" class="node-title">前端／UI</text>
    <text x="45" y="929" class="node-body">→ Kimi K3</text>
    <text x="45" y="954" class="node-body">遊戲類例外；基準待核</text>
  </g>
  <g>
    <rect x="275" y="842" width="230" height="142" rx="18" class="card unverified" stroke="#a879e8"/>
    <text x="295" y="870" class="node-meta">AMR-C05 · [3904,5434)</text>
    <text x="295" y="903" class="node-title">困難後端</text>
    <text x="295" y="929" class="node-body">→ Fable 5</text>
    <text x="295" y="954" class="node-body">例行 CRUD 不付溢價</text>
  </g>
  <g>
    <rect x="525" y="842" width="230" height="142" rx="18" class="card unverified" stroke="#69cf94"/>
    <text x="545" y="870" class="node-meta">AMR-C06 · [5434,6728)</text>
    <text x="545" y="903" class="node-title">除錯</text>
    <text x="545" y="929" class="node-body">→ GPT-5.6 Sol</text>
    <text x="545" y="954" class="node-body">成功條件＋獨立測試</text>
  </g>
  <g>
    <rect x="775" y="842" width="230" height="142" rx="18" class="card unverified" stroke="#a879e8"/>
    <text x="795" y="870" class="node-meta">AMR-C07 · [6728,8307)</text>
    <text x="795" y="903" class="node-title">長時無人值守</text>
    <text x="795" y="929" class="node-body">→ Fable 5</text>
    <text x="795" y="954" class="node-body">驗進度＋限制主動行動</text>
  </g>
  <g>
    <rect x="1025" y="842" width="230" height="142" rx="18" class="card unverified" stroke="#35c7d4"/>
    <text x="1045" y="870" class="node-meta">AMR-C08 · [8307,9678)</text>
    <text x="1045" y="903" class="node-title">高量／低風險</text>
    <text x="1045" y="929" class="node-body">→ K3／開放權重</text>
    <text x="1045" y="954" class="node-body">先確認未到能力邊界</text>
  </g>
  <g>
    <rect x="1275" y="842" width="230" height="142" rx="18" class="card unverified" stroke="#35c7d4"/>
    <text x="1295" y="870" class="node-meta">AMR-C09 · [9678,10530)</text>
    <text x="1295" y="903" class="node-title">圖片／影片</text>
    <text x="1295" y="929" class="node-body">→ Kimi K3</text>
    <text x="1295" y="954" class="node-body">多模態＋前端重建</text>
  </g>
  <g>
    <rect x="1525" y="842" width="250" height="142" rx="18" class="card unverified" stroke="#7ca6d8"/>
    <text x="1545" y="870" class="node-meta">AMR-C10 · [10530,11646)</text>
    <text x="1545" y="903" class="node-title">研究／長上下文</text>
    <text x="1545" y="929" class="node-body">高風險 → Fable 5</text>
    <text x="1545" y="954" class="node-body">高量初篩 → K3／開放</text>
  </g>

  <text x="70" y="1040" class="section">跨切約束與更新迴圈</text>
  <path d="M285 1082 L265 1020 L265 790 L500 790 L500 530 L530 530" class="edge-soft"/>
  <path d="M635 1082 L515 1020 L480 1020 L480 550 L530 550" class="edge-soft"/>
  <path d="M985 1082 L1515 1020 L1515 790 L1300 790 L1300 550 L1270 550" class="edge-soft"/>
  <path d="M1270 526 C1290 526, 1290 610, 1280 620 L1265 1035 C1265 1060, 1300 1070, 1335 1082" class="edge-gold"/>
  <text x="1280" y="1042" class="edge-label" fill="#f6c453">motivates</text>

  <g>
    <rect x="110" y="1082" width="350" height="118" rx="18" class="card unverified"/>
    <text x="132" y="1110" class="node-meta">AMR-C13 · [14732,17082)</text>
    <text x="132" y="1142" class="node-title">每完成任務成本</text>
    <text x="132" y="1168" class="node-body">token＋重試＋人工修訂＋快取</text>
  </g>
  <g>
    <rect x="460" y="1082" width="350" height="118" rx="18" class="card unverified"/>
    <text x="482" y="1110" class="node-meta">AMR-C15 · [19910,21425)</text>
    <text x="482" y="1142" class="node-title">合規與資料駐留</text>
    <text x="482" y="1168" class="node-body">先篩部署條件，再談能力排名</text>
  </g>
  <g>
    <rect x="810" y="1082" width="350" height="118" rx="18" class="card unverified"/>
    <text x="832" y="1110" class="node-meta">AMR-C16 · [21425,22842)</text>
    <text x="832" y="1142" class="node-title">供應商可切換性</text>
    <text x="832" y="1168" class="node-body">薄抽象層保留議價與故障韌性</text>
  </g>
  <g>
    <rect x="1160" y="1082" width="350" height="118" rx="18" class="card unverified" stroke="#f6c453"/>
    <text x="1182" y="1110" class="node-meta">AMR-C17 · [22842,24229)</text>
    <text x="1182" y="1142" class="node-title">每數週重評路由</text>
    <text x="1182" y="1168" class="node-body">排名、價格、政策與供應都會變</text>
  </g>
  <g>
    <rect x="1515" y="1082" width="260" height="118" rx="18" class="card missing"/>
    <text x="1537" y="1110" class="node-meta">AMR-C14 · [17082,19910)</text>
    <text x="1537" y="1142" class="node-title">SaaS 路由案例</text>
    <text x="1537" y="1168" class="node-body">預期結果，未提供量測</text>
  </g>

  <rect x="70" y="1250" width="1660" height="58" rx="18" fill="#0b1728" stroke="#314a67"/>
  <text x="95" y="1276" class="node-body">溯源：每張卡均標示試作候選 ID 與原文 char_span；線上關係名稱來自候選邊。</text>
  <text x="95" y="1298" class="node-meta">有損投影｜未顯示全部 25 條邊｜不可由本 SVG 回寫模塊或邊｜support_status 不代表主張為真</text>
</svg>
