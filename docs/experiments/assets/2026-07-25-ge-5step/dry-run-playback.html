<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F3a 缺口驅動導航｜試跑回放</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#dfe3e8; --ink:#1b1f24; --dim:#6b7480; --faint:#98a1ac;
    --cyan:#0e7490; --emerald:#047857; --amber:#b45309; --rose:#be123c; --violet:#6d28d9;
    --cyan-bg:#e0f4f8; --emerald-bg:#dcf5ea; --amber-bg:#fdf0dc; --rose-bg:#fde7ec; --violet-bg:#eee7fb;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --panel:#141a22; --line:#242c38; --ink:#e6edf3; --dim:#9aa6b2; --faint:#6b7684;
    --cyan:#22d3ee; --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; --violet:#a78bfa;
    --cyan-bg:#0c2f38; --emerald-bg:#0d3328; --amber-bg:#3a2a08; --rose-bg:#3a1420; --violet-bg:#241a3d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme:dark){
    html:not([data-theme="light"]){
      --bg:#0d1117; --panel:#141a22; --line:#242c38; --ink:#e6edf3; --dim:#9aa6b2; --faint:#6b7684;
      --cyan:#22d3ee; --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; --violet:#a78bfa;
      --cyan-bg:#0c2f38; --emerald-bg:#0d3328; --amber-bg:#3a2a08; --rose-bg:#3a1420; --violet-bg:#241a3d;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans TC",monospace;
    font-size:13px;line-height:1.55}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 48px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  h1{font-size:16px;margin:0;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:11.5px}
  .btn{font:inherit;font-size:11.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:5px 11px;cursor:pointer}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:var(--cyan-bg);border-color:transparent;color:var(--cyan);font-weight:600}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
  input[type=range]{flex:1;min-width:200px;accent-color:var(--cyan)}
  .beatno{color:var(--dim);font-size:11px;min-width:64px;text-align:right}

  .now{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);
    min-height:74px;display:flex;gap:12px;align-items:flex-start}
  .now .kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .now .txt strong{display:block;font-size:13.5px;margin-bottom:2px}
  .now .txt span{color:var(--dim);font-size:11.5px}

  .grid{display:grid;grid-template-columns:270px 1fr 250px;gap:14px;margin-top:14px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px}
  .panel h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}

  .gap{border:1px solid var(--line);border-left-width:3px;border-radius:7px;padding:7px 9px;margin-bottom:7px;
    transition:background .4s,border-color .4s,opacity .4s,transform .4s}
  .gap .id{font-weight:700;font-size:11px}
  .gap .st{float:right;font-size:10px;color:var(--dim)}
  .gap .s{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .gap.open{border-left-color:var(--faint)}
  .gap.claim{border-left-color:var(--amber);background:var(--amber-bg)}
  .gap.fail{border-left-color:var(--rose);background:var(--rose-bg);animation:shake .5s}
  .gap.done{border-left-color:var(--emerald);background:var(--emerald-bg);opacity:.62}
  .gap.done .id{text-decoration:line-through}
  .gap.new{border-left-color:var(--violet);background:var(--violet-bg)}
  .gap.enter{animation:pop .45s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes slidein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

  .track{position:relative;padding-left:20px}
  .track::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .ev{position:relative;margin-bottom:8px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
  .ev.anim{animation:slidein .4s}
  .ev::before{content:"";position:absolute;left:-17px;top:14px;width:9px;height:9px;border-radius:50%;
    background:var(--panel);border:2px solid var(--faint)}
  .ev .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .ev .sid{font-weight:700;font-size:11.5px}
  .ev .ty{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--cyan-bg);color:var(--cyan)}
  .ev .d{color:var(--dim);font-size:11.5px;margin-top:2px}
  .ev.step::before{border-color:var(--cyan)}
  .ev.gateok{border-color:var(--emerald);background:var(--emerald-bg)}
  .ev.gateok::before{border-color:var(--emerald);background:var(--emerald)}
  .ev.gateok .ty{background:transparent;color:var(--emerald)}
  .ev.bad{border-color:var(--rose);background:var(--rose-bg)}
  .ev.bad::before{border-color:var(--rose);background:var(--rose)}
  .ev.bad .ty{background:transparent;color:var(--rose)}
  .ev.meta{border-style:dashed}
  .ev.meta::before{border-color:var(--violet)}
  .ev .qs{margin-top:6px;display:flex;flex-direction:column;gap:3px}
  .q{font-size:11px;color:var(--dim)}
  .q b{font-weight:700}
  .q.ok b{color:var(--emerald)} .q.no b{color:var(--rose)}

  .stat{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:11.5px}
  .stat:last-child{border-bottom:0}
  .stat b{font-size:13px}
  .gates{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .gt{border:1px solid var(--emerald);background:var(--emerald-bg);color:var(--emerald);border-radius:7px;padding:6px 8px;
    font-size:11px;animation:pop .45s}
  .gt b{display:block;font-size:11.5px}
  .gt span{color:var(--dim)}
  .warn{margin-top:10px;border:1px solid var(--amber);background:var(--amber-bg);color:var(--amber);
    border-radius:7px;padding:7px 9px;font-size:11px;animation:pop .45s}
  .warn b{display:block}
  .ivl{margin-top:10px;font-size:11px;color:var(--dim)}
  .ivl code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .srcpanel{margin-top:14px}
  .srchead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .srchead .who{font-size:11.5px;color:var(--dim)}
  .srchead .who b{color:var(--cyan)}
  .srcbox{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    background:var(--bg);white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.85;color:var(--faint)}
  .srcbox mark{background:var(--cyan-bg);color:var(--ink);border-radius:3px;padding:1px 2px;
    box-shadow:inset 0 -2px 0 var(--cyan);transition:background .4s}
  .srcbox mark.ev{background:var(--emerald-bg);box-shadow:inset 0 -2px 0 var(--emerald)}
  .srcbox mark.none{background:var(--rose-bg);box-shadow:inset 0 -2px 0 var(--rose)}
  .nosrc{font-size:11px;color:var(--rose)}
  footer{margin-top:18px;color:var(--faint);font-size:10.5px;line-height:1.8}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:10px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="hTitle"></h1>
      <div class="sub"><span id="hSub"></span> <span id="hNote"></span></div>
    </div>
    <button class="btn" id="theme">◐ 主題</button>
  </header>

  <div class="bar">
    <button class="btn primary" id="play">▶ 播放</button>
    <button class="btn" id="prev">◀</button>
    <button class="btn" id="next">▶</button>
    <button class="btn" id="reset">⟲ 重來</button>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <span class="beatno" id="beatno">0 / 0</span>
    <button class="btn" id="speed">1.0×</button>
  </div>

  <div class="now">
    <span class="kind" id="nowKind">待播</span>
    <div class="txt"><strong id="nowTitle">按播放開始</strong><span id="nowDetail"></span></div>

  <div class="grid">
    <section class="panel">
      <h2 id="lbItems"></h2>
      <div id="gaps"></div>
      <div class="ivl" id="intervalBox"></div>
    </section>

    <section class="panel">
      <h2 id="lbTrack"></h2>
      <div class="track" id="track"></div>
    </section>

    <section class="panel">
      <h2 id="lbStats"></h2>
      <div class="stat"><span id="lbSteps"></span><b id="mSteps">0</b></div>
      <div class="stat"><span id="lbGates"></span><b id="mGates">0</b></div>
      <div class="stat"><span id="lbOpen"></span><b id="mGap">0 / 0</b></div>
      <div class="stat"><span id="lbRate"></span><b id="mRate">—</b></div>
      <div class="gates" id="gateList"></div>
      <div id="warnBox"></div>
    </section>
  </div>

  <section class="panel srcpanel" id="srcPanel">
    <div class="srchead">
      <h2 style="margin:0" id="lbSource"></h2>
      <div class="who" id="srcWho">—</div>
    </div>
    <div class="srcbox" id="srcBox"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script type="text/plain" id="srcText">Graph Engineering: build 1000+ agent loops in one window, from one prompt (full 5-step course)

THE Loop Engineering's successor and the workflow that runs your agents 10x wider...

Most people who build a multi-step agent end up with a straight line: step one, step two, step three. Each one waiting for the last to finish before it starts.

Here's what almost nobody checks: half those steps never needed to wait. They just queue, one job at a time, until the context window fills and the agent forgets what it was doing.

- It wasn't slow because the model was weak.
- It was slow because you drew a line where the work was a graph.

This guide takes you from that line to a graph that fans out across a fleet and checks its own work. Five steps. By Step 2 you'll have built one - it gets you a working graph and names the traps that break real ones, and I'll flag where the hard parts begin.

Chapter 0 - What graph engineering actually is

A month ago the field was talking about loops. Peter Steinberger caught it in nine words: "Are we still talking about loops, or have we moved to graphs?"

A loop is one cycle of getting better: try something -> check the result -> adjust -> go again. That's the atom: a single agent improving one thing on repeat. (If you've read my Loop Engineering piece, this is that.)

But the single loop has a known failure. A support team ties a feedback loop to one metric: ticket resolution rate. The number climbs for months while satisfaction drops. The bot learned to close tickets fast instead of solving them.

That's Goodhart's law. A loop can only see its own metric. It can't ask whether the target is right, or notice its own measurement drifting.

The answer isn't a better loop. It's a graph of loops - a network where cycles watch and correct each other.

For agents, that means one thing: stop writing one agent that does everything in a line - design the shape of the work - what runs before what, what runs at the same time, what waits. Nodes do the thinking. Edges carry the results.

And Claude Code shipped the tooling to build these directly: dynamic workflows.

Step 1 - See the edges that aren't there

A graph has two parts:

- A node is one unit of work: one agent, one job, one input, one output.
- An edge is a dependency: this node's output feeds that node's input.

The mistake everyone makes is treating "and then" as an edge. "Summarize this file and then tell me the weather" - the weather doesn't read the summary. Those are two independent jobs a linear script chains for no reason. Each one waits on the last for nothing.

The habit that starts everything: for every "and then," ask - does the next step actually read the previous step's output?

- If yes -> real edge. Keep the order.
- If no -> no edge. The wait is wasted. Run them side by side.

If no data crosses between two boxes, they're independent. That independence is what you'll exploit for the rest of this guide.

Your plain "do A, then B, then C" agent is already a graph - just the saddest one: a single chain where if C stalls, D never happens.

Step 2 - Build your first graph (start to finish)

Enough theory. Build one and watch it run.

Before you start:

- Claude Code v2.1.154+ (check with claude --version)
- A paid plan. On Max, Team, or Enterprise, workflows are on by default. On Pro, switch on the Dynamic workflows row in /config

1. Open a repo you know. A real one, so the result means something.

2. Paste this prompt:

    Create a workflow to audit every route file under src/routes/
    for missing auth checks. Spawn one agent per file, then run an
    independent verifier on each finding before reporting.
    Analyze a maximum of 20 files to start.

Swap src/routes/ for where your files live. The "max 20" line keeps your first run cheap.

3. Watch "workflow" light up. Claude Code highlights it: "Dynamic workflow requested." That's your signal a graph is building, not a normal chat.

4. Approve the plan. Claude writes a JavaScript orchestration script and shows the phases first. Read them, pick "Yes, run it."

5. Let the fleet run. One agent per file, in parallel, while your session stays free. Type /workflows to watch it live: scope, fan-out, verify, synthesize.

6. Read the one answer. Not twenty separate chats. One report - because the intermediate results lived in the script's variables, not your context.

That's a graph. A dozen agents, from one sentence.

About the "zero tokens" claim you'll hear: the coordination script is code, so passing results between agents doesn't re-spend context the way a chat handoff does. But the agents still cost usage. A workflow costs meaningfully more than a normal session. The saving is in coordination, not the work. Start scoped, watch usage, then widen.

Make it yours: when a run is good, press s. It saves to ~/.claude/workflows, re-runnable by name. Now change the task and keep the shape. Swap "missing auth checks" for "unhandled promises," or "functions over 100 lines."

How far this scales

One workflow run can fan out to 1,000 agents, with up to 16 working at once. That's where "1000+ loops in one window" comes from - not a metaphor, the feature's actual ceiling.

And the scale is the point. A thousand agents means a job no single context could ever hold - a whole codebase audited at once, a migration that touches every file, a search that runs a thousand angles in parallel. The 16-at-once limit just means the fleet moves in waves, chewing through all thousand without you babysitting a single one.

Start at 20 to see how a run behaves and what it costs - then open it up.

Step 3 - The part that actually breaks

You built a graph. Here's where real ones fall over. Two failures matter most.

Failure one: the graph agrees with itself.

When an agent checks its own work, it goes easy on itself. Models prefer their own outputs. So you put a verifier on the edge - a separate node that confirms a finding before it flows downstream.

The catch nobody names: the verifier needs clean context. Hand it the same conversation the executor had, and it isn't verifying. It's agreeing with itself in a different font.

A graph of agents sharing one context is a single loop in a costume. It fails the same way - later, more expensively, with more green lights on the way down.

So the verifier is a fresh node - own context - checking a real signal: not "did the agent say it's done," but "does the test actually pass."

Failure two: agents stepping on each other.

This isn't hypothetical. When Bun's team first fanned a large port across many agents, the run failed operationally: agents used shared git commands in one workspace and overwrote each other. The fix was structural, not clever prompting. They forbade the unsafe commands and gave each group its own isolated worktree.

That's the real lesson of parallelism - two agents writing the same file race.

Before you fan out, answer three questions:

- Where does each agent work?
- How do results merge?
- What happens when two disagree?

A graph without that plan doesn't scale. It fails faster.

Step 4 - Six graphs to build this week

The method: find the real edges -> fan out -> verify on independent context -> isolate the workers.

Each of these is that same shape, aimed at a new job. Change the task line and go:

- Security sweep - one agent per file hunting missing auth, a verifier confirming each hit (the one you built).
- Cited report with /deep-research - ships already: splits your question into angles, searches in parallel, agents refute each other before writing.
- Port a module - file by file, tests as a gate, failures looped back.
- Adversarial diff review - routed by size: small change -> one pass; big one -> full parallel audit.
- Scheduled ecosystem scan - save once, re-run by name.
- Discovery of unknown size - finders run in parallel, each result checked against everything seen, looping until two rounds find nothing new.

What the ceiling looks like

Bun's Zig-to-Rust port ran on this exact machinery. Around 50 workflows, a peak of 64 agents in parallel. Roughly 535,000 lines of Zig turned into over a million lines of Rust, in 11 days.

It also cost about $165,000 in usage. It needed a human designing and monitoring the whole thing. And it drew public criticism over whether that much AI-authored code can be safely reviewed.

The scale is real. So is the price, and the supervision.

Step 5 - The anchors that keep a graph honest

Topology alone doesn't buy truth. A network of agents all confirming each other, none of them touching anything real, fails exactly like the single loop did - just with more moving parts.

The graph needs anchors: nodes that can't be argued with.

- Tests that actually ran - not "should pass," did pass.
- A verifier on evidence, not vibes.
- Frozen rules the agents are never allowed to tune - because they're the ones an optimizer would weaken.

The graph is only as honest as the things in it that refuse to move.

When a graph is the wrong choice

Most tasks are not graphs. Reaching for one when you don't need it just burns money and adds ways to fail. Skip the graph when:

- The task is small or isolated. Adding a function, fixing one bug. A workflow is pure overhead here - a single agent is faster and cheaper.
- You need tight oversight. If you want to read and approve every step before the next one runs, a graph's whole point (running wide without you) works against you.
- You don't know what you're looking for yet. Exploratory work wants one agent you can steer, not a fleet committed to a plan before you understand the problem.
- The steps genuinely depend on each other. If every step reads the last step's output, it's a real chain. Parallelism has nothing to grab. Forcing a graph onto a truly sequential task just adds coordination cost for zero speedup.

The tell is Step 1. If you can't find two boxes with no arrow between them, there's no graph to build. It's a loop, and a loop is fine.

A graph is a tool for width - independent work, done at once. When the work isn't wide, the line was never the problem.

The shift

A prompter asks a question. An architect draws a graph.

The linear agent was never the ceiling. It was the first shape - the one everyone reaches for because it matches how we type: one line, one thing at a time.

Once you see the nodes and edges, you stop asking the agent to do more and start asking the graph to do it wider:

- Fan out where the work is independent.
- Gate the edges where confidence matters.
- Freeze the nodes that hold the truth.

Most people will keep queueing steps in a line. The few who learn to draw the graph, and to respect what breaks it, will run a fleet.

Draw the graph. Stay the architect.
</script>

<script>
const DATA=JSON.parse(document.getElementById("data").textContent);
const ITEMS=DATA.items||{}, B=DATA.beats||[];
const L=Object.assign({
  items:"狀態清單", track:"軌跡", stats:"帳與訊號", source:"原文對位",
  unit:"項", steps:"步數", gates:"已完成關卡", openLabel:"開／消", rate:"消化率（淨）",
  open:"待處理", claim:"宣告完成·驗收中", done:"已完成", newst:"新增"
},DATA.labels||{});

const $=id=>document.getElementById(id);
const KC={cyan:["var(--cyan-bg)","var(--cyan)"],emerald:["var(--emerald-bg)","var(--emerald)"],
  amber:["var(--amber-bg)","var(--amber)"],rose:["var(--rose-bg)","var(--rose)"],violet:["var(--violet-bg)","var(--violet)"]};

document.title=DATA.title||"回放";
$("hTitle").textContent=DATA.title||"回放";
$("hSub").textContent=DATA.subtitle||"";
$("hNote").textContent=DATA.note?("— "+DATA.note):"";
$("lbItems").textContent=L.items; $("lbTrack").textContent=L.track; $("lbStats").textContent=L.stats;
$("lbSource").textContent=L.source;
$("lbSteps").textContent=L.steps; $("lbGates").textContent=L.gates;
$("lbOpen").textContent=L.unit+" "+L.openLabel; $("lbRate").textContent=L.rate;
$("foot").innerHTML=(DATA.footer||"單頁回放（journey-playback）· 空白鍵播放／暫停，<kbd>←</kbd><kbd>→</kbd> 單步");

function stateAt(n){
  const st={items:{},order:[],steps:[],gates:[],events:[],focus:null,ivl:null,warn:null,failed:null,newg:null};
  for(let i=0;i<=n && i<B.length;i++){
    const b=B[i];
    if(b.show)b.show.forEach(k=>{const id=(typeof k==="number")?("GAP-"+k):k;
      if(!(id in st.items)){st.items[id]="open";st.order.push(id)}});
    if(b.focus)st.focus=b.focus;
    if(b.ivl)st.ivl=b.ivl;
    if(b.claim)st.items[b.claim]="claim";
    if(b.fail){st.items[b.fail]="open";st.failed=(i===n)?b.fail:null}
    if(b.done)st.items[b.done]="done";
    if(b.newgap){st.items[b.newgap]="new";if(!st.order.includes(b.newgap))st.order.push(b.newgap);st.newg=b.newgap}
    if(b.step)st.steps.push(b.step);
    if(b.gate)st.gates.push(b.gate);
    if(b.warn)st.warn=b.warn;
    st.events.push({b,i});
  }
  return st;
}

function render(n,animate){
  const st=stateAt(n), b=n>=0?B[n]:null;
  if(b){
    const c=KC[b.c]||KC.cyan;
    $("nowKind").textContent=b.k||"";$("nowKind").style.background=c[0];$("nowKind").style.color=c[1];
    $("nowTitle").textContent=b.t||"";$("nowDetail").textContent=b.d||"";
  }else{
    $("nowKind").textContent="待播";$("nowKind").style.background="";$("nowKind").style.color="";
    $("nowTitle").textContent="按播放開始";$("nowDetail").textContent=DATA.intro||"";
  }

  const gw=$("gaps");gw.innerHTML="";
  st.order.forEach(id=>{
    const s=st.items[id];
    const el=document.createElement("div");
    el.className="gap "+s+((st.newg===id&&b&&b.newgap)?" enter":"")+((st.failed===id)?" fail":"");
    const lab={open:L.open,claim:L.claim,done:L.done,new:L.newst}[s];
    el.innerHTML='<span class="id">'+id+'</span><span class="st">'+lab+'</span><span class="s">'+(ITEMS[id]||"")+'</span>';
    if(st.focus===id&&s==="open")el.style.borderLeftColor="var(--cyan)";
    gw.appendChild(el);
  });
  $("intervalBox").innerHTML=st.ivl?(L.intervalHint||"未結區間：")+"<code>"+st.ivl+"</code>":"";

  const tr=$("track");tr.innerHTML="";
  st.events.forEach(({b:e,i})=>{
    if(!(e.step||e.gate||e.qs||e.newgap||e.terminal))return;
    let cls="ev";
    if(e.step)cls+=" step";
    if(e.gate)cls+=" gateok";
    if(e.fail)cls+=" bad";
    if(e.newgap||e.terminal)cls+=" meta";
    if(animate&&i===n)cls+=" anim";
    const d=document.createElement("div");d.className=cls;
    const head=e.step?('<span class="sid">'+e.step.id+'</span><span class="ty">'+e.step.ty+'</span>')
      :e.gate?('<span class="sid">'+e.gate.id+'</span><span class="ty">'+(L.closed||"完成")+' · '+e.gate.n+' 步</span>')
      :e.fail?('<span class="sid">'+(L.failed||"驗收未過")+'</span><span class="ty">'+(L.failedHint||"不結案")+'</span>')
      :('<span class="sid">'+(e.k||"")+'</span>');
    const qs=e.qs?('<div class="qs">'+e.qs.map(q=>'<span class="q '+(q[1]?"ok":"no")+'"><b>'+(q[1]?"✓":"✗")+'</b> '+q[0]+'</span>').join("")+'</div>'):"";
    d.innerHTML='<div class="top">'+head+'</div><div class="d">'+(e.step?e.step.d:e.t)+'</div>'+qs;
    tr.appendChild(d);
  });
  if(animate&&tr.lastChild)tr.lastChild.scrollIntoView({block:"nearest",behavior:"smooth"});

  const done=Object.values(st.items).filter(v=>v==="done").length;
  const open=Object.values(st.items).filter(v=>v!=="done").length;
  const added=Object.values(st.items).filter(v=>v==="new").length;
  $("mSteps").textContent=st.steps.length;
  $("mGates").textContent=st.gates.length;
  $("mGap").textContent=open+" / "+done;
  $("mRate").textContent=st.steps.length?((done-added)/st.steps.length).toFixed(2)+" "+L.unit+"/步":"—";
  $("gateList").innerHTML=st.gates.map(g=>'<div class="gt"><b>'+g.id+'　'+(g.t||"")+'</b><span>'+(L.gateMetric||"steps_to_arrive")+' = '+g.n+'</span></div>').join("");
  $("warnBox").innerHTML=st.warn?('<div class="warn"><b>⚠ '+st.warn.t+'</b>'+st.warn.d+'</div>'):"";

  renderSource(n);
  $("scrub").value=n<0?0:n;
  $("beatno").textContent=(n+1)+" / "+B.length;
}

// 注意：這裡不可出現與 build.py 佔位符完全相同的字串，否則會被一起替換掉
const RAW=(document.getElementById("srcText").textContent||"").replace(/^\n/,"");
const SRC=/^__SOURCE.TEXT__\s*$/.test(RAW.trim())?"":RAW;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
if(!SRC)$("srcPanel").style.display="none";

function renderSource(n){
  if(!SRC)return;
  const box=$("srcBox"),who=$("srcWho"),m=(n>=0&&B[n])?B[n].spans:null;
  if(!m){who.textContent=L.noSpan||"這一拍不讀原文";box.innerHTML=esc(SRC);return}
  const cls=m.k==="ev"?' class="ev"':m.k==="none"?' class="none"':"";
  const sp=(m.s||[]).slice().sort((a,b)=>a[0]-b[0]);
  let out="",p=0;
  sp.forEach(([a,b])=>{if(a<p)return;out+=esc(SRC.slice(p,a))+"<mark"+cls+">"+esc(SRC.slice(a,b))+"</mark>";p=b});
  box.innerHTML=out+esc(SRC.slice(p));
  who.innerHTML='正在讀：<b>'+m.w+'</b>　'+sp.map(x=>"["+x[0]+","+x[1]+")").join(" ");
  const first=box.querySelector("mark");
  if(first)box.scrollTop=Math.max(0,first.offsetTop-box.offsetTop-40);
}

let cur=-1,timer=null,speed=1;
const SPEEDS=[1,1.8,.6];
function go(n,animate){cur=Math.max(-1,Math.min(B.length-1,n));render(cur,animate!==false)}
function play(){
  if(timer){stop();return}
  if(cur>=B.length-1)cur=-1;
  $("play").textContent="⏸ 暫停";
  timer=setInterval(()=>{if(cur>=B.length-1){stop();return}go(cur+1)},1500/speed);
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶ 播放"}

$("play").onclick=play;
$("next").onclick=()=>{stop();go(cur+1)};
$("prev").onclick=()=>{stop();go(cur-1,false)};
$("reset").onclick=()=>{stop();go(-1,false)};
$("scrub").oninput=e=>{stop();go(+e.target.value,false)};
$("speed").onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  $("speed").textContent=speed.toFixed(1)+"×";if(timer){stop();play()}};
$("theme").onclick=()=>{
  const d=document.documentElement;
  const now=d.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  d.setAttribute("data-theme",now==="dark"?"light":"dark");
};
addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault();play()}
  if(e.key==="ArrowRight"){stop();go(cur+1)}
  if(e.key==="ArrowLeft"){stop();go(cur-1,false)}
});
$("scrub").max=Math.max(0,B.length-1);
render(-1,false);
</script>
</body>
</html>
